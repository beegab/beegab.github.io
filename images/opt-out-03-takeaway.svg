="14" fill="#121912" text-anchor="end">581</text><text x="590" y="274" font-family="IBM Plex Mono, Menlo, Consolas, monospace" font-size="14" fill="#121912">DeleteMe · per year</text><text x="920" y="274" font-family="IBM Plex Mono, Menlo, Consolas, monospace" font-size="14" fill="#121912" text-anchor="end">$129.00</text><text x="590" y="304" font-family="IBM Plex Mono, Menlo, Consolas, monospace" font-size="14" fill="#121912">Kanary · per year</text><text x="920" y="304" font-family="IBM Plex Mono, Menlo, Consolas, monospace" font-size="14" fill="#121912" text-anchor="end">$250.00</text><text x="590" y="334" font-family="IBM Plex Mono, Menlo, Consolas, monospace" font-size="14" fill="#121912">5 years, either one</text><text x="920" y="334" font-family="IBM Plex Mono, Menlo, Consolas, monospace" font-size="14" fill="#121912" text-anchor="end">$645–$1,250</text><text x="590" y="364" font-family="IBM Plex Mono, Menlo, Consolas, monospace" font-size="14" fill="#121912">or by hand</text><text x="920" y="364" font-family="IBM Plex Mono, Menlo, Consolas, monospace" font-size="14" fill="#121912" text-anchor="end">form · email · wait</text><text x="590" y="394" font-family="IBM Plex Mono, Menlo, Consolas, monospace" font-size="14" fill="#121912">then again in</text><text x="920" y="394" font-family="IBM Plex Mono, Menlo, Consolas, monospace" font-size="14" fill="#121912" text-anchor="end">a few months</text><line x1="590" y1="416" x2="920" y2="416" stroke="#121912" stroke-dasharray="4 4" opacity=".5"/><text x="755.0" y="446" font-family="IBM Plex Mono, Menlo, Consolas, monospace" font-size="13" fill="#9c3f55" text-anchor="middle">* your privacy, rented.</text><text x="755.0" y="464" font-family="IBM Plex Mono, Menlo, Consolas, monospace" font-size="13" fill="#9c3f55" text-anchor="middle">protection ends when payment does.</text><rect x="674.0" y="488" width="162" height="162" fill="#ffffff"/><rect x="728.0" y="494" width="6" height="6" fill="#121912"/><rect x="746.0" y="494